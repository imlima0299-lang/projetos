<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>te amo!</title>
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=BdjA3Y8bTxW8&format=png&color=000000"
        type="image/x-icon">
    <style>
        body {
            background-image: url(https://i.pinimg.com/736x/20/a5/43/20a543c918e8a778c04b0f0ee6192bfe.jpg);
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-position: center top;
        }

        main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        h1,
        p {
            text-align: center;
            color: #4247DC;
        }

        p {
            text-decoration: underline;
        }

        a {
            background-color: #1C1D40;
            color: #FFFFFF;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 50px;
            width: 100px;
            display: block;
            margin: auto;
            text-align: center;
        }

        a:hover {
            background-color: #4247DC;
            color: #0c0101;
            transition: all 0.4s ease;
        }

        section {
            backdrop-filter: blur(3px);
            background: transparent;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.575);
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Oi amor, sabia que eu te amo?</h1>
            <p>clica se me ama</p>
            <a href="maria.html">ME CLICA!</a>
        </section>
    </main>
</body>

</html>
