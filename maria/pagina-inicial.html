<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>te amo!</title>
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=BdjA3Y8bTxW8&format=png&color=000000"
        type="image/x-icon">
    <style>
        body {
            background-image: url(t.jpg);
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-position: center top;
        }

        main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #6E74FF;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.432);
        }

        h1,
        p {
            text-align: center;
        }

        p {
            text-decoration: underline;
        }

        a {
            background-color: #1C1D40;
            color: #FFFFFF;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 50px;
            width: 100px;
            display: block;
            margin: auto;
            text-align: center;
        }

        a:hover {
            background-color: #4247dc;
            color: #181818;
            transition: all 0.4s ease;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>EM MANUTENÇÃO</h1>
            <p>AGUARDE OS PROXIMO DIA...</p>
        </section>
    </main>
</body>

</html>
